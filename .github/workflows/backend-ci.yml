name: Backend CI

on:
  push:
    branches: [ "main", "master", "develop" ]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    name: Backend Test Suite & Security Audit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      - name: Run Test Suite
        env:
          ENVIRONMENT: testing
          JWT_SECRET: test_secret_key_for_ci_pipeline_minimum_32_characters_long
        run: |
          pytest -q

      - name: Run Dependency Audit
        run: |
          pip-audit

  postgres:
    name: PostgreSQL Migration & Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ccms_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ccms_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create disposable PostgreSQL test database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d ccms_db -c "CREATE DATABASE ccms_test;"

      - name: Run specialised PostgreSQL migration flow
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ccms_db
          ENVIRONMENT: testing
          JWT_SECRET: test_secret_key_for_ci_pipeline_minimum_32_characters_long
        run: python scripts/test_migration_flow.py --db-url "$DATABASE_URL"

      - name: Run PostgreSQL-specific tests only
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ccms_test
          CCMS_DISPOSABLE_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ccms_test
          TEST_POSTGRESQL_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ccms_test
          ENVIRONMENT: testing
          JWT_SECRET: test_secret_key_for_ci_pipeline_minimum_32_characters_long
        run: >-
          pytest -v -rs
          tests/test_migration_0007_complaint_lifecycle.py
          tests/test_migration_0011_0012_public_feed.py
          tests/test_google_auth.py
          tests/test_sprint3_residence_concurrency.py
          tests/test_postgresql_concurrency.py
          -k postgresql
          --junitxml=postgresql-tests.xml

      - name: Check the S4-08 concurrency tests ran and did not skip
        run: |
          python - <<'EOF'
          import sys
          import xml.etree.ElementTree as ET

          cases = [
              case for case in ET.parse("postgresql-tests.xml").getroot().iter("testcase")
              if case.get("classname", "").endswith("test_postgresql_concurrency")
          ]
          ran = [case for case in cases if case.find("skipped") is None]
          print(f"S4-08 concurrency tests: {len(ran)} ran, {len(cases) - len(ran)} skipped")
          if len(cases) != 5 or len(ran) != 5:
              sys.exit("Expected all 5 PostgreSQL concurrency tests to run and pass; none may be skipped.")
          EOF
