services:
  db:
    image: postgres:16-alpine
    container_name: ccms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ccms_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ccms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ccms_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ccms_pgdata:
    driver: local
